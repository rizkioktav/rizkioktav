<svg width="920" height="220" viewBox="0 0 920 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyberpunk Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="neon-pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d1c" />
      <stop offset="60%" stop-color="#060914" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.22" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Rajdhani:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title-main {
        font-family: 'Orbitron', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: 5px;
        fill: #ffffff;
      }
      
      .glitch-1 {
        animation: glitch-anim-1 3.2s infinite linear alternate-reverse;
        fill: #00f3ff;
        opacity: 0.8;
      }
      
      .glitch-2 {
        animation: glitch-anim-2 2.7s infinite linear alternate-reverse;
        fill: #ff0055;
        opacity: 0.8;
      }

      .sub-title {
        font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #00f3ff;
      }
      
      .meta-text {
        font-family: 'JetBrains Mono', 'Segoe UI Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .scan-laser {
        animation: laser-sweep 4s linear infinite;
      }

      .pulse-dot {
        animation: pulse-glow 1.5s ease-in-out infinite alternate;
      }

      @keyframes glitch-anim-1 {
        0%, 93%, 100% { transform: translate(0, 0); }
        94% { transform: translate(-3px, 1px); }
        96% { transform: translate(2px, -2px); }
        98% { transform: translate(-1px, 2px); }
      }

      @keyframes glitch-anim-2 {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(3px, -1px); }
        95% { transform: translate(-2px, 2px); }
        97% { transform: translate(2px, -1px); }
      }

      @keyframes laser-sweep {
        0% { transform: translateY(-20px); opacity: 0; }
        15%, 85% { opacity: 0.65; }
        100% { transform: translateY(240px); opacity: 0; }
      }

      @keyframes pulse-glow {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Clean Cyber Card Base with Safe Padding -->
  <rect x="2" y="2" width="916" height="216" rx="12" fill="url(#bg-grad)" stroke="#1a2744" stroke-width="1.5" />

  <!-- Perspective 3D Grid Floor in Background -->
  <g opacity="0.55">
    <line x1="40" y1="150" x2="880" y2="150" stroke="url(#grid-fade)" stroke-width="1" />
    <line x1="25" y1="172" x2="895" y2="172" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="10" y1="198" x2="910" y2="198" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- Vanishing rays converging toward center -->
    <line x1="460" y1="130" x2="90" y2="216" stroke="#00f3ff" stroke-opacity="0.12" stroke-width="1" />
    <line x1="460" y1="130" x2="250" y2="216" stroke="#00f3ff" stroke-opacity="0.16" stroke-width="1" />
    <line x1="460" y1="130" x2="460" y2="216" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="460" y1="130" x2="670" y2="216" stroke="#00f3ff" stroke-opacity="0.16" stroke-width="1" />
    <line x1="460" y1="130" x2="830" y2="216" stroke="#00f3ff" stroke-opacity="0.12" stroke-width="1" />
  </g>

  <!-- Cyber HUD Corners -->
  <path d="M 24 38 L 24 24 L 38 24" stroke="#00f3ff" stroke-width="2" fill="none" filter="url(#cyan-glow)" />
  <path d="M 896 38 L 896 24 L 882 24" stroke="#ff0055" stroke-width="2" fill="none" />
  <path d="M 24 182 L 24 196 L 38 196" stroke="#00f3ff" stroke-width="2" fill="none" />
  <path d="M 896 182 L 896 196 L 882 196" stroke="#ff0055" stroke-width="2" fill="none" />

  <!-- Top Status Telemetry Bar (Anchored Safely) -->
  <g transform="translate(42, 34)">
    <circle cx="6" cy="0" r="4" fill="#00ff66" class="pulse-dot" />
    <text x="18" y="1" class="meta-text" fill="#8892b0" dominant-baseline="central">DEV_NODE // RIZKIOKTAV: ONLINE</text>
  </g>
  <text x="878" y="35" class="meta-text" fill="#00f3ff" text-anchor="end" dominant-baseline="central">INDONESIA · FULLSTACK ARCHITECT · 3+ YRS</text>

  <!-- Title with Glitch Chromatic Shift -->
  <g transform="translate(42, 85)">
    <text x="0" y="0" class="title-main glitch-2" dominant-baseline="central">RIZKI OKTAVIANUS</text>
    <text x="0" y="0" class="title-main glitch-1" dominant-baseline="central">RIZKI OKTAVIANUS</text>
    <text x="0" y="0" class="title-main" filter="url(#cyan-glow)" dominant-baseline="central">RIZKI OKTAVIANUS</text>
  </g>

  <!-- Subtitle with PHP & Fullstack Highlight -->
  <g transform="translate(44, 116)">
    <text x="0" y="0" class="sub-title" dominant-baseline="central">FULLSTACK DEVELOPER · PHP LOVER &amp; LARAVEL ENTHUSIAST</text>
  </g>

  <!-- Circuit Laser Divider Line -->
  <line x1="42" y1="134" x2="878" y2="134" stroke="#16223d" stroke-width="1.5" />
  <line x1="42" y1="134" x2="380" y2="134" stroke="url(#neon-cyan-grad)" stroke-width="2" filter="url(#cyan-glow)" />
  <line x1="640" y1="134" x2="878" y2="134" stroke="url(#neon-pink-grad)" stroke-width="2" />

  <!-- Clean Cyber Badges (Evenly Distributed & Non-Clipping) -->
  <g transform="translate(42, 150)">
    <!-- Badge 1: Experience -->
    <g transform="translate(0, 0)">
      <rect width="125" height="26" rx="4" fill="#0c162d" stroke="#00f3ff" stroke-width="1" />
      <text x="62.5" y="13" class="meta-text" fill="#00f3ff" text-anchor="middle" dominant-baseline="central">⚡ 3+ YEARS EXP</text>
    </g>

    <!-- Badge 2: Frontend with SASS -->
    <g transform="translate(135, 0)">
      <rect width="245" height="26" rx="4" fill="#0c162d" stroke="#00f3ff" stroke-width="1" />
      <text x="122.5" y="13" class="meta-text" fill="#00f3ff" text-anchor="middle" dominant-baseline="central">REACT · VUE · ANGULAR · SASS</text>
    </g>

    <!-- Badge 3: Backend & Databases -->
    <g transform="translate(390, 0)">
      <rect width="250" height="26" rx="4" fill="#1b1224" stroke="#ff0055" stroke-width="1" />
      <text x="125" y="13" class="meta-text" fill="#ff0055" text-anchor="middle" dominant-baseline="central">PHP · NODE · MYSQL · POSTGRES</text>
    </g>

    <!-- Badge 4: Kong & Postman -->
    <g transform="translate(650, 0)">
      <rect width="186" height="26" rx="4" fill="#1b170e" stroke="#ffe600" stroke-width="1" />
      <text x="93" y="13" class="meta-text" fill="#ffe600" text-anchor="middle" dominant-baseline="central">KONG · POSTMAN · MSSQL</text>
    </g>
  </g>

  <!-- Animated Scanline Laser across Banner -->
  <line x1="20" y1="0" x2="900" y2="0" stroke="#00f3ff" stroke-width="1.5" opacity="0.6" class="scan-laser" />
</svg>
