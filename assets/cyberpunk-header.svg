<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyberpunk Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0077fe" />
    </linearGradient>
    <linearGradient id="neon-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="40%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters for Glow & Glitch -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .cyber-title {
        font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: 4px;
        fill: #ffffff;
      }
      
      .glitch-copy-1 {
        animation: glitch-anim-1 2.8s infinite linear alternate-reverse;
        fill: #00f3ff;
        opacity: 0.75;
      }
      
      .glitch-copy-2 {
        animation: glitch-anim-2 2.3s infinite linear alternate-reverse;
        fill: #ff0055;
        opacity: 0.75;
      }

      .cyber-sub {
        font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 3px;
        fill: #00f3ff;
      }
      
      .cyber-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
      }

      .scan-line {
        animation: scanline 4s linear infinite;
      }

      .pulse-dot {
        animation: pulse 1.5s ease-in-out infinite alternate;
      }

      @keyframes glitch-anim-1 {
        0%, 100% { transform: translate(0, 0); }
        92% { transform: translate(0, 0); }
        93% { transform: translate(-3px, 1px); }
        94% { transform: translate(2px, -2px); }
        95% { transform: translate(-2px, 2px); }
        96% { transform: translate(3px, 0); }
        98% { transform: translate(0, 0); }
      }

      @keyframes glitch-anim-2 {
        0%, 100% { transform: translate(0, 0); }
        90% { transform: translate(0, 0); }
        91% { transform: translate(3px, -1px); }
        93% { transform: translate(-2px, 2px); }
        95% { transform: translate(2px, -1px); }
        97% { transform: translate(-1px, -2px); }
        99% { transform: translate(0, 0); }
      }

      @keyframes scanline {
        0% { transform: translateY(-30px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(290px); opacity: 0; }
      }

      @keyframes pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="260" rx="12" fill="url(#bg-grad)" stroke="#1a223f" stroke-width="1.5" />

  <!-- Cyber 3D Perspective Grid at Bottom -->
  <g opacity="0.65">
    <!-- Horizontal floor grid lines -->
    <line x1="50" y1="180" x2="850" y2="180" stroke="url(#grid-fade)" stroke-width="1" />
    <line x1="30" y1="195" x2="870" y2="195" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="15" y1="212" x2="885" y2="212" stroke="url(#grid-fade)" stroke-width="1.4" />
    <line x1="5" y1="230" x2="895" y2="230" stroke="url(#grid-fade)" stroke-width="1.6" />
    <line x1="0" y1="250" x2="900" y2="250" stroke="#ff0055" stroke-opacity="0.5" stroke-width="2" />

    <!-- Perspective convergence rays -->
    <line x1="450" y1="165" x2="50" y2="260" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1" />
    <line x1="450" y1="165" x2="160" y2="260" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1" />
    <line x1="450" y1="165" x2="270" y2="260" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1" />
    <line x1="450" y1="165" x2="370" y2="260" stroke="#00f3ff" stroke-opacity="0.35" stroke-width="1" />
    <line x1="450" y1="165" x2="450" y2="260" stroke="#00f3ff" stroke-opacity="0.5" stroke-width="1.5" />
    <line x1="450" y1="165" x2="530" y2="260" stroke="#00f3ff" stroke-opacity="0.35" stroke-width="1" />
    <line x1="450" y1="165" x2="630" y2="260" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1" />
    <line x1="450" y1="165" x2="740" y2="260" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1" />
    <line x1="450" y1="165" x2="850" y2="260" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="140" fill="#00f3ff" opacity="0.04" />
  <circle cx="700" cy="110" r="150" fill="#ff0055" opacity="0.04" />

  <!-- Cyberpunk HUD Brackets (Top Left / Right / Bottom) -->
  <path d="M 25 45 L 25 25 L 55 25" stroke="#00f3ff" stroke-width="2.5" fill="none" filter="url(#cyan-glow)" />
  <path d="M 875 45 L 875 25 L 845 25" stroke="#ff0055" stroke-width="2.5" fill="none" filter="url(#pink-glow)" />
  <path d="M 25 215 L 25 235 L 55 235" stroke="#00f3ff" stroke-width="2.5" fill="none" />
  <path d="M 875 215 L 875 235 L 845 235" stroke="#ff0055" stroke-width="2.5" fill="none" />

  <!-- Top Status Bar & Indicators -->
  <g transform="translate(40, 36)">
    <circle cx="8" cy="8" r="4" fill="#00ff66" class="pulse-dot" />
    <text x="20" y="12" class="cyber-tag" fill="#8892b0">SYSTEM_NODE // RIZKIOKTAV-CORE: ONLINE</text>
    <text x="730" y="12" class="cyber-tag" fill="#ffe600">EXP // 3+ YEARS</text>
  </g>

  <!-- Glitch Title Layers -->
  <g transform="translate(60, 108)">
    <!-- Red/Pink chromatic shift -->
    <text x="0" y="0" class="cyber-title glitch-copy-2">RIZKI OKTAVIANUS</text>
    <!-- Cyan chromatic shift -->
    <text x="0" y="0" class="cyber-title glitch-copy-1">RIZKI OKTAVIANUS</text>
    <!-- Main text layer with cyan glow -->
    <text x="0" y="0" class="cyber-title" filter="url(#cyan-glow)">RIZKI OKTAVIANUS</text>
  </g>

  <!-- Subtitle with Glowing Cyber Neon Line -->
  <g transform="translate(62, 138)">
    <text x="0" y="0" class="cyber-sub">FULLSTACK WEB DEVELOPER · PHP LOVER · API ARCHITECT</text>
  </g>

  <!-- Horizontal Tech Circuit Laser -->
  <line x1="60" y1="152" x2="840" y2="152" stroke="#1f2d5a" stroke-width="1.5" />
  <line x1="60" y1="152" x2="380" y2="152" stroke="url(#neon-cyan-grad)" stroke-width="2.5" filter="url(#cyan-glow)" />
  <line x1="600" y1="152" x2="840" y2="152" stroke="url(#neon-pink-grad)" stroke-width="2.5" filter="url(#pink-glow)" />
  <polygon points="380,149 386,152 380,155" fill="#00f3ff" />
  <polygon points="600,149 594,152 600,155" fill="#ff0055" />

  <!-- Cyber Badges / Pill Tags (Cyberpunk Hex Style) -->
  <g transform="translate(60, 172)">
    <!-- Badge 1: PHP & Laravel -->
    <path d="M 0 0 L 115 0 L 125 24 L 10 24 Z" fill="#0c142b" stroke="#00f3ff" stroke-width="1" />
    <text x="16" y="16" class="cyber-tag" fill="#00f3ff">PHP · LARAVEL</text>

    <!-- Badge 2: React & Vue & Angular -->
    <g transform="translate(135, 0)">
      <path d="M 0 0 L 160 0 L 170 24 L 10 24 Z" fill="#0c142b" stroke="#00f3ff" stroke-width="1" />
      <text x="16" y="16" class="cyber-tag" fill="#00f3ff">REACT · VUE · ANGULAR</text>
    </g>

    <!-- Badge 3: Node.js & APIs -->
    <g transform="translate(315, 0)">
      <path d="M 0 0 L 150 0 L 160 24 L 10 24 Z" fill="#1b0e26" stroke="#ff0055" stroke-width="1" />
      <text x="16" y="16" class="cyber-tag" fill="#ff0055">NODE · POSTMAN · KONG</text>
    </g>

    <!-- Badge 4: SQL Databases -->
    <g transform="translate(485, 0)">
      <path d="M 0 0 L 175 0 L 185 24 L 10 24 Z" fill="#1b170e" stroke="#ffe600" stroke-width="1" />
      <text x="16" y="16" class="cyber-tag" fill="#ffe600">MYSQL · POSTGRES · MSSQL</text>
    </g>

    <!-- Badge 5: Ready for discussions -->
    <g transform="translate(680, 0)">
      <path d="M 0 0 L 150 0 L 160 24 L 10 24 Z" fill="#0b2416" stroke="#00ff66" stroke-width="1" />
      <text x="14" y="16" class="cyber-tag" fill="#00ff66">OPEN FOR DISCUSSIONS</text>
    </g>
  </g>

  <!-- Animated Scanline Laser traversing across the banner -->
  <line x1="20" y1="0" x2="880" y2="0" stroke="#00f3ff" stroke-width="1.5" opacity="0.6" filter="url(#cyan-glow)" class="scan-line" />
</svg>
