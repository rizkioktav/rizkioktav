<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyberpunk Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="neon-pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.18" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Rajdhani:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title-main {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 34px;
        letter-spacing: 5px;
        fill: #ffffff;
      }
      
      .glitch-1 {
        animation: glitch-anim-1 3s infinite linear alternate-reverse;
        fill: #00f3ff;
        opacity: 0.8;
      }
      
      .glitch-2 {
        animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        fill: #ff0055;
        opacity: 0.8;
      }

      .sub-title {
        font-family: 'Rajdhani', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #00f3ff;
      }
      
      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .scan-laser {
        animation: laser-sweep 4s linear infinite;
      }

      .pulse {
        animation: pulse-dot 1.5s ease-in-out infinite alternate;
      }

      @keyframes glitch-anim-1 {
        0%, 93%, 100% { transform: translate(0, 0); }
        94% { transform: translate(-3px, 1px); }
        96% { transform: translate(2px, -2px); }
        98% { transform: translate(-1px, 2px); }
      }

      @keyframes glitch-anim-2 {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(3px, -1px); }
        95% { transform: translate(-2px, 2px); }
        97% { transform: translate(2px, -1px); }
      }

      @keyframes laser-sweep {
        0% { transform: translateY(-20px); opacity: 0; }
        15%, 85% { opacity: 0.7; }
        100% { transform: translateY(220px); opacity: 0; }
      }

      @keyframes pulse-dot {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Clean Cyber Card Base -->
  <rect width="900" height="200" rx="10" fill="url(#bg-grad)" stroke="#1a2744" stroke-width="1.2" />

  <!-- Subtle Perspective Grid Floor -->
  <g opacity="0.6">
    <line x1="30" y1="140" x2="870" y2="140" stroke="url(#grid-fade)" stroke-width="1" />
    <line x1="15" y1="160" x2="885" y2="160" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="0" y1="185" x2="900" y2="185" stroke="#00f3ff" stroke-opacity="0.2" stroke-width="1.4" />

    <!-- Vanishing perspective rays -->
    <line x1="450" y1="120" x2="100" y2="200" stroke="#00f3ff" stroke-opacity="0.12" stroke-width="1" />
    <line x1="450" y1="120" x2="250" y2="200" stroke="#00f3ff" stroke-opacity="0.15" stroke-width="1" />
    <line x1="450" y1="120" x2="450" y2="200" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1.2" />
    <line x1="450" y1="120" x2="650" y2="200" stroke="#00f3ff" stroke-opacity="0.15" stroke-width="1" />
    <line x1="450" y1="120" x2="800" y2="200" stroke="#00f3ff" stroke-opacity="0.12" stroke-width="1" />
  </g>

  <!-- Cyber HUD Corners -->
  <path d="M 20 35 L 20 20 L 35 20" stroke="#00f3ff" stroke-width="2" fill="none" filter="url(#cyan-glow)" />
  <path d="M 880 35 L 880 20 L 865 20" stroke="#ff0055" stroke-width="2" fill="none" />
  <path d="M 20 165 L 20 180 L 35 180" stroke="#00f3ff" stroke-width="2" fill="none" />
  <path d="M 880 165 L 880 180 L 865 180" stroke="#ff0055" stroke-width="2" fill="none" />

  <!-- Top Status Indicator -->
  <g transform="translate(32, 30)">
    <circle cx="6" cy="6" r="3.5" fill="#00ff66" class="pulse" />
    <text x="16" y="9.5" class="tag-text" fill="#8892b0">DEV_NODE // RIZKIOKTAV: ONLINE</text>
    <text x="710" y="9.5" class="tag-text" fill="#00f3ff">INDONESIA · FULLSTACK ARCHITECT</text>
  </g>

  <!-- Title with Glitch Chromatic Shift -->
  <g transform="translate(45, 88)">
    <text x="0" y="0" class="title-main glitch-2">RIZKI OKTAVIANUS</text>
    <text x="0" y="0" class="title-main glitch-1">RIZKI OKTAVIANUS</text>
    <text x="0" y="0" class="title-main" filter="url(#cyan-glow)">RIZKI OKTAVIANUS</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(47, 114)">
    <text x="0" y="0" class="sub-title">FULLSTACK WEB DEVELOPER · PHP LOVER &amp; LARAVEL ENTHUSIAST</text>
  </g>

  <!-- Circuit Laser Divider -->
  <line x1="45" y1="126" x2="855" y2="126" stroke="#16223d" stroke-width="1.5" />
  <line x1="45" y1="126" x2="360" y2="126" stroke="url(#neon-cyan-grad)" stroke-width="2" filter="url(#cyan-glow)" />
  <line x1="620" y1="126" x2="855" y2="126" stroke="url(#neon-pink-grad)" stroke-width="2" />

  <!-- Cyber Badges -->
  <g transform="translate(45, 142)">
    <!-- Badge 1: 3+ Years Experience -->
    <rect width="130" height="24" rx="4" fill="#0c162d" stroke="#00f3ff" stroke-width="1" />
    <text x="14" y="16" class="tag-text" fill="#00f3ff">⚡ 3+ YEARS EXP</text>

    <!-- Badge 2: Modern Frontend & Backend -->
    <g transform="translate(142, 0)">
      <rect width="210" height="24" rx="4" fill="#0c162d" stroke="#00f3ff" stroke-width="1" />
      <text x="14" y="16" class="tag-text" fill="#00f3ff">REACT · VUE · ANGULAR · NODE</text>
    </g>

    <!-- Badge 3: Multi-Database -->
    <g transform="translate(364, 0)">
      <rect width="215" height="24" rx="4" fill="#1b1224" stroke="#ff0055" stroke-width="1" />
      <text x="14" y="16" class="tag-text" fill="#ff0055">MYSQL · POSTGRES · MSSQL</text>
    </g>

    <!-- Badge 4: Kong & Postman -->
    <g transform="translate(591, 0)">
      <rect width="145" height="24" rx="4" fill="#1b170e" stroke="#ffe600" stroke-width="1" />
      <text x="14" y="16" class="tag-text" fill="#ffe600">KONG · POSTMAN</text>
    </g>
  </g>

  <!-- Laser Scanline -->
  <line x1="20" y1="0" x2="880" y2="0" stroke="#00f3ff" stroke-width="1.5" opacity="0.6" class="scan-laser" />
</svg>
